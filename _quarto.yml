project:
  type: website
  render:
    - "*.qmd"
    - "!PLAN.md"

website:
  title: "R + Python Refresher"
  navbar:
    background: primary
    title: "R + Py Refresher"
    right:
      - icon: github
        href: https://github.com/EnduringChung/r-python-refresher
  sidebar:
    style: docked
    contents:
      - index.qmd
      - setup.qmd
      - section: "Week 1 — Language core"
        contents: w1/*.qmd
      - section: "Week 2 — Wrangling, viz, stats"
        contents: w2/*.qmd
      - section: "Week 3 — Software engineering + repro"
        contents: w3/*.qmd
  page-navigation: true

format:
  live-html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    css: styles.css

metadata:
  lang: en
